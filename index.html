<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наш год — Софа ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Montserrat',sans-serif;
  color:white;
  text-align:center;
  background:black;
  overflow-x:hidden;
}

canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

h1 { font-family:'Great Vibes',cursive; font-size:48px; margin:30px 0 10px; }
p { font-size:18px; margin:10px 0; }
button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:white;
  color:#ff4d79;
  font-weight:bold;
  cursor:pointer;
  margin:15px;
  font-size:16px;
}

img {
  width:90%;
  max-width:350px;
  border-radius:15px;
  margin-top:15px;
  box-shadow:0 0 20px rgba(255,255,255,0.6);
}

.timer { font-size:20px; margin-top:20px; }

/* Сердечки */
.heart {
  position:fixed;
  font-size:18px;
  animation:float 5s linear forwards;
}

@keyframes float {
  from {transform:translateY(0); opacity:1;}
  to {transform:translateY(-100vh); opacity:0;}
}
</style>
</head>

<body>

<!-- Стартовая страница -->
<div id="start">
  <h1>Софа ❤️</h1>
  <p>Это наш альбом за целый год…</p>
  <button onclick="nextStep()">Открыть</button>
</div>

<!-- Вопрос любви -->
<div id="question" style="display:none;">
  <h1>Ты любишь меня?</h1>
  <button onclick="nextStep()">Да 💖</button>
</div>

<!-- Альбом -->
<div id="album" style="display:none;">
  <h1 id="monthTitle"></h1>
  <img id="monthPhoto" src="">
  <p id="monthText"></p>
  <button onclick="nextMonth()">Следующий месяц</button>
</div>

<!-- Финал -->
<div id="final" style="display:none;">
  <h1>Софа, я люблю тебя ❤️</h1>
  <p>Мы вместе уже:</p>
  <div class="timer" id="timer"></div>
</div>

<script>
// Массив месяцев
const months = [
  {name:"Январь ❄️", text:"Наши первые воспоминания года...", img:"images/jan.jpg"},
  {name:"Февраль ❤️", text:"Месяц тепла и любви...", img:"images/feb.jpg"},
  {name:"Март 🌸", text:"Весна началась с нас...", img:"images/mar.jpg"},
  {name:"Апрель ☀️", text:"Тёплые прогулки вместе...", img:"images/apr.jpg"},
  {name:"Май 🌷", text:"Цветы и улыбки...", img:"images/may.jpg"},
  {name:"Июнь 🌊", text:"Летние приключения...", img:"images/jun.jpg"},
  {name:"Июль 🌞", text:"Солнце и смех...", img:"images/jul.jpg"},
  {name:"Август ✨", text:"Яркие моменты вместе...", img:"images/aug.jpg"},
  {name:"Сентябрь 🍁", text:"Тёплые вечера...", img:"images/sep.jpg"},
  {name:"Октябрь 🎃", text:"Осенние впечатления...", img:"images/oct.jpg"},
  {name:"Ноябрь 🌧", text:"Дождь и уют...", img:"images/nov.jpg"},
  {name:"Декабрь 🎄", text:"Праздничные воспоминания...", img:"images/dec.jpg"},
];

let step = 0; // 0=start,1=question,2=album
let currentMonth = 0;

function nextStep() {
  if(step===0){
    document.getElementById("start").style.display="none";
    document.getElementById("question").style.display="block";
    step=1;
  } else if(step===1){
    document.getElementById("question").style.display="none";
    document.getElementById("album").style.display="block";
    step=2;
    showMonth();
  }
}

function showMonth(){
  document.getElementById("monthTitle").innerText = months[currentMonth].name;
  document.getElementById("monthText").innerText = months[currentMonth].text;
  document.getElementById("monthPhoto").src = months[currentMonth].img;
}

function nextMonth(){
  currentMonth++;
  if(currentMonth < months.length){
    showMonth();
  } else {
    document.getElementById("album").style.display="none";
    document.getElementById("final").style.display="block";
    startTimer();
    startHearts();
  }
}

// Таймер
let startDays=268;
let startHours=15;
let totalSeconds=startDays*86400 + startHours*3600;
function startTimer(){
  setInterval(()=>{
    totalSeconds++;
    let d=Math.floor(totalSeconds/86400);
    let h=Math.floor((totalSeconds%86400)/3600);
    let m=Math.floor((totalSeconds%3600)/60);
    let s=totalSeconds%60;
    document.getElementById("timer").innerText = d+" дней "+h+" часов "+m+" минут "+s+" секунд";
  },1000);
}

// Сердечки
function startHearts(){
  setInterval(()=>{
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left = Math.random()*100+"vw";
    heart.style.bottom = "0";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  },300);
}

// Звёзды
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let stars=[];
for(let i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2});
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();
</script>

</body>
</html>
