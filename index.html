<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наш год — Софа ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:'Montserrat',sans-serif;
  color:white;
  background:black;
}

canvas { position:fixed; top:0; left:0; z-index:-1; }

.book {
  width:90%;
  max-width:400px;
  height:80vh;
  margin:10vh auto;
  perspective:2000px;
  position:relative;
}

.page {
  width:100%;
  height:100%;
  background:rgba(255,182,193,0.95);
  position:absolute;
  border-radius:20px;
  box-shadow:0 0 20px rgba(255,255,255,0.5);
  padding:30px;
  box-sizing:border-box;
  transform-origin:left;
  transition:transform 1s;
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.page.flipped { transform:rotateY(-180deg); }

h1 { font-family:'Great Vibes',cursive; font-size:36px; margin-bottom:15px; }
button {
  padding:10px 18px;
  margin-top:15px;
  border:none;
  border-radius:20px;
  background:white;
  color:#ff4d79;
  cursor:pointer;
  font-weight:bold;
}
img { width:100%; max-height:200px; object-fit:cover; border-radius:15px; margin:10px 0; }
.timer { font-size:18px; margin-top:15px; }
.heart { position:fixed; font-size:18px; animation:float 5s linear forwards; }

@keyframes float {
  from {transform:translateY(0); opacity:1;}
  to {transform:translateY(-100vh); opacity:0;}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="book" id="book">

<!-- Приветствие -->
<div class="page" id="p0">
  <h1>Софа ❤️</h1>
  <p>Это наш альбом за целый год…</p>
  <button onclick="flip(0)">Открыть</button>
</div>

<!-- Вопрос любви -->
<div class="page" id="p1">
  <h1>Ты любишь меня?</h1>
  <button onclick="flip(1)">Да 💖</button>
</div>

<!-- Месяцы -->
<div class="page" id="p2">
  <h1 id="monthTitle">Январь ❄️</h1>
  <img id="monthPhoto" src="images/jan.jpg">
  <p id="monthText">Наши первые воспоминания года...</p>
  <button onclick="nextMonth()">Следующий месяц</button>
</div>

<!-- Финал -->
<div class="page" id="pFinal">
  <h1>Софа, я люблю тебя ❤️</h1>
  <p>Мы вместе уже:</p>
  <div class="timer" id="timer"></div>
</div>

</div>

<script>
// Массив месяцев с подписями
const months = [
  {name:"Январь ❄️", text:"Наши первые воспоминания года...", img:"images/jan.jpg"},
  {name:"Февраль ❤️", text:"Месяц тепла и любви...", img:"images/feb.jpg"},
  {name:"Март 🌸", text:"Весна началась с нас...", img:"images/mar.jpg"},
  {name:"Апрель ☀️", text:"Тёплые прогулки вместе...", img:"images/apr.jpg"},
  {name:"Май 🌷", text:"Цветы и улыбки...", img:"images/may.jpg"},
  {name:"Июнь 🌊", text:"Летние приключения...", img:"images/jun.jpg"},
  {name:"Июль 🌞", text:"Солнце и смех...", img:"images/jul.jpg"},
  {name:"Август ✨", text:"Яркие моменты вместе...", img:"images/aug.jpg"},
  {name:"Сентябрь 🍁", text:"Тёплые вечера...", img:"images/sep.jpg"},
  {name:"Октябрь 🎃", text:"Осенние впечатления...", img:"images/oct.jpg"},
  {name:"Ноябрь 🌧", text:"Дождь и уют...", img:"images/nov.jpg"},
  {name:"Декабрь 🎄", text:"Праздничные воспоминания...", img:"images/dec.jpg"},
];

let currentMonth = 0;

function flip(num){
  document.getElementById("p"+num).classList.add("flipped");
  if(num===1) document.getElementById("p2").classList.remove("flipped");
}

function nextMonth(){
  currentMonth++;
  if(currentMonth<months.length){
    document.getElementById("monthTitle").innerText = months[currentMonth].name;
    document.getElementById("monthText").innerText = months[currentMonth].text;
    document.getElementById("monthPhoto").src = months[currentMonth].img;
  } else {
    document.getElementById("book").querySelectorAll(".page").forEach(p=>p.classList.add("flipped"));
    document.getElementById("pFinal").classList.remove("flipped");
    startTimer();
    startHearts();
  }
}

/* Таймер */
let startDays=268;
let startHours=15;
let totalSeconds = startDays*86400 + startHours*3600;

function startTimer(){
  setInterval(()=>{
    totalSeconds++;
    let d=Math.floor(totalSeconds/86400);
    let h=Math.floor((totalSeconds%86400)/3600);
    let m=Math.floor((totalSeconds%3600)/60);
    let s=totalSeconds%60;
    document.getElementById("timer").innerText=d+" дней "+h+" часов "+m+" минут "+s+" секунд";
  },1000);
}

/* Сердца */
function startHearts(){
  setInterval(()=>{
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.bottom="0";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  },300);
}

/* Звёзды */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2});
}

function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();
</script>

</body>
</html>
